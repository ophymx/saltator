[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
saltator-core = { path = "crates/saltator-core" }
saltator-cluster = { path = "crates/saltator-cluster" }
saltator-shard = { path = "crates/saltator-shard" }
saltator-store = { path = "crates/saltator-store" }
saltator-roomserver = { path = "crates/saltator-roomserver" }
saltator-userserver = { path = "crates/saltator-userserver" }
saltator-fedout = { path = "crates/saltator-fedout" }
saltator-cs-api = { path = "crates/saltator-cs-api" }
saltator-federation = { path = "crates/saltator-federation" }
saltator-media = { path = "crates/saltator-media" }
saltator-testsupport = { path = "crates/saltator-testsupport" }
saltator-admin-ui = { path = "crates/saltator-admin-ui" }

anyhow = "1"
thiserror = "2"
ruma = { version = "0.16", default-features = false, features = ["signatures", "rand", "client-api-s"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
# Two codecs, not five. `rocks.rs` is the only place that opens a DB and it
# writes exactly two things: Lz4 for state, None for the Raft log. snappy,
# zlib and bzip2 were never named in any `set_compression_type` call, so
# nothing this server has written can be encoded with them and dropping
# them cannot orphan data. zstd is kept for one reason: it is the codec a
# bottommost/cold tier would want, and keeping it means that becomes an
# options change rather than a dependency change.
#
# `default-features = false` is safe here even though it looks like it
# would disable static linking: rocksdb declares
# `librocksdb-sys = { features = ["static"], default-features = false }`
# unconditionally, outside its own feature table. `bindgen-runtime` does
# have to be named again — it IS in rocksdb's default list, and without it
# bindgen gets neither `runtime` nor `static`.
#
# `jemalloc` is the allocator, and it is the whole process's allocator, not
# just RocksDB's. librocksdb-sys pulls tikv-jemalloc-sys with
# `unprefixed_malloc_on_supported_platforms`, so jemalloc exports plain
# `malloc`/`free` and interposes on everything: RocksDB's C++ `operator
# new`, and Rust's `System` allocator, which bottoms out in the same libc
# symbols. That is what makes it safe — the feature also defines
# `ROCKSDB_JEMALLOC`, which lets RocksDB size heap blocks with
# `je_malloc_usable_size`, and handing a jemalloc usable-size query a
# system-malloc pointer would be undefined behaviour. One allocator, so
# the question never arises, and no `#[global_allocator]` is needed.
#
# The reason to want it is the LSM allocation pattern: many similarly-sized,
# long-lived block-cache and memtable buffers, which is where glibc malloc
# fragments and jemalloc's size classes do not.
#
# Caveat worth knowing before the musl work in docker/complement/Dockerfile:
# librocksdb-sys lists musl in NO_JEMALLOC_TARGETS, so on a musl target the
# `ROCKSDB_JEMALLOC` define is silently skipped — the crate still builds and
# links, RocksDB just does not use the hooks. Unprefixed override is
# likewise a glibc-platform property. jemalloc is a glibc-build win here.
rocksdb = { version = "0.23", default-features = false, features = [
    "lz4",
    "zstd",
    "jemalloc",
    "bindgen-runtime",
] }
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3"
toml = "0.8"
include_dir = "0.7"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
argon2 = "0.5"
blake3 = "1"
rand = "0.8"
base64 = "0.22"
axum = "0.8"
# `tls-rustls-no-provider`, NOT `tls-rustls`: the latter is defined as
# `["tls-rustls-no-provider", "rustls/aws-lc-rs"]`, and Cargo features are
# additive across the whole graph — so naming it here turned on
# `rustls/aws-lc-rs` for EVERYONE, silently overriding the explicit `ring`
# choice below and compiling aws-lc-sys (cmake + C, plus a NASM blob) for
# nothing. axum-server is the only crate in the tree that did this; tonic
# and reqwest both declare their rustls dependency provider-free.
#
# The provider is ours to install instead, which `saltator` does at startup
# (`rustls::crypto::ring::default_provider().install_default()`); the
# integration tests that stand up their own listeners do the same.
axum-server = { version = "0.7", default-features = false, features = [
    "tls-rustls-no-provider",
] }
tower-http = { version = "0.6", features = ["cors"] }
http = "1"
bytes = "1"
futures-util = "0.3"
sha2 = "0.10"
# ID-token validation for the OIDC login slice: JWKS parsing and
# RS256/ES256 signature checks. Rides on `ring`, already in the tree.
jsonwebtoken = "9"
chacha20poly1305 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `ring` as the single crypto backend, and `default-features = false` is
# what makes it single: rustls 0.23's defaults are
# ["aws_lc_rs", "logging", "prefer-post-quantum", "std", "tls12"], so the
# plain `"0.23"` this replaces was a second, silent vote for aws-lc-rs on
# top of axum-server's. Dropping `prefer-post-quantum` is the one real
# cost — it is aws-lc-rs-only (X25519MLKEM768), and no Matrix homeserver
# on the other end of a federation connection negotiates it today.
#
# One backend also keeps ring's C/asm as the only native crypto in the
# build, the property pg-agent-rs relies on for its static musl target.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
rcgen = "0.13"

# Debug info, not debug *builds*. Measured on this tree: `target/debug`
# was 6.5 GiB, of which the single `librocksdb_sys` rlib was 894 MB and
# one integration-test binary was 748 MB — overwhelmingly DWARF, rewritten
# to disk on every relink, and with one binary per integration-test file
# there are a lot of relinks. It is also why CI's fmt+clippy+test job needs
# a "Free disk space" step before it can link the test suite at all.
#
# Line tables, not the full DWARF, for our own crates. What survives is
# what actually gets used: `.debug_line` still resolves a backtrace frame
# to `crates/…/foo.rs:214`, so panics, `#[should_panic]` and RUST_BACKTRACE
# read exactly as before. What goes is variable and type DWARF — stepping
# in a debugger and printing locals. If you are reaching for gdb on
# saltator's own code, build that crate with
# `--config 'profile.dev.debug=2'`.
[profile.dev]
debug = "line-tables-only"

# Dependencies get none at all, which is the half of the saving that costs
# nothing anyone would notice: nobody steps into rocksdb, ruma or tokio
# from here, and their debug info is the overwhelming majority of it.
# `debug = false` also reaches the C/C++ compiles — cargo passes it through
# as DEBUG=false and the `cc` crate drops `-g` — which is what takes
# librocksdb-sys's 894 MB rlib apart. Frames through a dependency still
# carry symbol names, only not file and line.
[profile.dev.package."*"]
debug = false

# `release` is the everyday optimized profile: what CI ships to the
# Complement image and what local iteration rebuilds after every edit.
# No LTO and incremental on — LTO re-runs per *binary* at link time
# (each integration-test file is its own binary) and disables nothing a
# network-bound homeserver would notice, while costing minutes per
# rebuild. Measured on the dev box (8 cores / 15 GiB): a one-touch
# rebuild of the daemon went 148s → 6s after this split (plus mold +
# sccache from the README's local-acceleration recipe).
[profile.release]
incremental = true

# Actual distribution builds: `cargo build --profile dist`. Carries the
# LTO the old release profile had.
[profile.dist]
inherits = "release"
lto = "thin"
incremental = false
# Cargo already drops debuginfo at this optimization level; this drops the
# symbol table too, which is a meaningful slice of the binary and pure
# weight in a container image. Panics still name the crate and the
# message; only the backtrace frames go. chapbook and pg-agent-rs strip
# their shipped builds for the same reason. Build with
# `--config profile.dist.strip=false` when you do want a backtrace.
#
# Deliberately NOT on `release`: that profile is what the Complement
# image and the cluster/chaos harnesses run, and those are exactly the
# places a readable backtrace off a killed node earns its bytes.
strip = "symbols"
