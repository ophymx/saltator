[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
saltator-core = { path = "crates/saltator-core" }
saltator-cluster = { path = "crates/saltator-cluster" }
saltator-shard = { path = "crates/saltator-shard" }
saltator-store = { path = "crates/saltator-store" }
saltator-roomserver = { path = "crates/saltator-roomserver" }
saltator-userserver = { path = "crates/saltator-userserver" }
saltator-cs-api = { path = "crates/saltator-cs-api" }
saltator-federation = { path = "crates/saltator-federation" }
saltator-media = { path = "crates/saltator-media" }

anyhow = "1"
thiserror = "2"
ruma = { version = "0.16", default-features = false, features = ["signatures", "rand", "client-api-s"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
rocksdb = "0.23"
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"
protoc-bin-vendored = "3"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
argon2 = "0.5"
blake3 = "1"
rand = "0.8"
base64 = "0.22"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
http = "1"
bytes = "1"
futures-util = "0.3"
sha2 = "0.10"
chacha20poly1305 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
