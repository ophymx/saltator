// Internal RPC (spec.md §8).
//
// Envelopes are proto (field-number evolution carries N/N+1 rolling
// upgrades); payloads are versioned postcard bytes since both ends are
// always Saltator. Raft messages for ALL groups multiplex over these RPCs,
// discriminated by `group` (0 = metadata group, else shard id).
//
// Connection classes (control vs bulk) are separate channels established by
// the dialer; bulk-only services (checkpoint transfer, blob replication)
// will be added here in M4 and must only be served on the bulk channel.

syntax = "proto3";
package saltator.internal.v1;

message RaftPayload {
  uint64 group = 1;
  // postcard-encoded openraft request/response, versioned by `codec_version`.
  uint32 codec_version = 2;
  bytes payload = 3;
}

service RaftService {
  rpc AppendEntries(RaftPayload) returns (RaftPayload);
  rpc Vote(RaftPayload) returns (RaftPayload);
  rpc InstallSnapshot(RaftPayload) returns (RaftPayload);
}

message StatusRequest {}

message StatusResponse {
  uint64 node_id = 1;
  string server_name = 2;
  string version = 3;
  // Metadata-group view.
  bool initialized = 4;
  optional uint64 leader = 5;
  uint64 last_applied = 6;
  // The schema versions this node's BINARY speaks, per keyspace (the
  // migration gate: a leader proposes a migration only once every voter
  // reports support for the target version).
  repeated ShardSchema schemas = 7;
}

message ShardSchema {
  // Keyspace discriminant (matches saltator_store::Keyspace as u32).
  uint32 keyspace = 1;
  uint32 schema_version = 2;
}

// A node asking to join the cluster's metadata group (spec.md §4.4).
message JoinRequest {
  uint64 node_id = 1;
  // The joining node's internal-RPC address, recorded as its Raft node
  // address so the leader can replicate to it.
  string advertise_addr = 2;
}

message JoinResponse {
  // True if this node applied the membership change (it was the leader).
  bool joined = 1;
  // When not joined, the leader to retry against (absent if unknown yet).
  optional uint64 leader_id = 2;
  optional string leader_addr = 3;
}

// A proposal forwarded from a non-leader node (spec.md §9 "writes go
// through the leader"): the receiver applies it through the addressed
// group's Raft if it leads, else answers with a leader hint.
message ProposeRequest {
  uint64 group = 1;
  // Opaque app command bytes (the ShardApp owns their meaning).
  bytes command = 2;
}

message ProposeResponse {
  bool applied = 1;
  // Set when applied: the app's response bytes and the committed log
  // index — the forwarding node's read-your-writes barrier waits for its
  // local apply to reach that index before acking its client.
  bytes response = 2;
  uint64 log_index = 3;
  // Set when not applied: where the leader is believed to be.
  optional uint64 leader_id = 4;
  optional string leader_addr = 5;
}

service ControlService {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Propose(ProposeRequest) returns (ProposeResponse);
}
