// Internal RPC (spec.md §8).
//
// Envelopes are proto (field-number evolution carries N/N+1 rolling
// upgrades); payloads are versioned postcard bytes since both ends are
// always Saltator. Raft messages for ALL groups multiplex over these RPCs,
// discriminated by `group` (0 = metadata group, else shard id).
//
// Connection classes (control vs bulk) are separate channels established by
// the dialer; bulk-only services (checkpoint transfer, blob replication)
// will be added here in M4 and must only be served on the bulk channel.

syntax = "proto3";
package saltator.internal.v1;

message RaftPayload {
  uint64 group = 1;
  // postcard-encoded openraft request/response, versioned by `codec_version`.
  uint32 codec_version = 2;
  bytes payload = 3;
}

service RaftService {
  rpc AppendEntries(RaftPayload) returns (RaftPayload);
  rpc Vote(RaftPayload) returns (RaftPayload);
  rpc InstallSnapshot(RaftPayload) returns (RaftPayload);
}

message StatusRequest {}

message StatusResponse {
  uint64 node_id = 1;
  string server_name = 2;
  string version = 3;
  // Metadata-group view.
  bool initialized = 4;
  optional uint64 leader = 5;
  uint64 last_applied = 6;
  // The schema versions this node's BINARY speaks, per keyspace (the
  // migration gate: a leader proposes a migration only once every voter
  // reports support for the target version).
  repeated ShardSchema schemas = 7;
}

message ShardSchema {
  // Keyspace discriminant (matches saltator_store::Keyspace as u32).
  uint32 keyspace = 1;
  uint32 schema_version = 2;
}

// A node asking to join the cluster's metadata group (spec.md §4.4).
message JoinRequest {
  uint64 node_id = 1;
  // The joining node's internal-RPC address, recorded as its Raft node
  // address so the leader can replicate to it.
  string advertise_addr = 2;
}

message JoinResponse {
  // True if this node applied the membership change (it was the leader).
  bool joined = 1;
  // When not joined, the leader to retry against (absent if unknown yet).
  optional uint64 leader_id = 2;
  optional string leader_addr = 3;
}

// A proposal forwarded from a non-leader node (spec.md §9 "writes go
// through the leader"): the receiver applies it through the addressed
// group's Raft if it leads, else answers with a leader hint.
message ProposeRequest {
  uint64 group = 1;
  // Opaque app command bytes (the ShardApp owns their meaning).
  bytes command = 2;
}

message ProposeResponse {
  bool applied = 1;
  // Set when applied: the app's response bytes and the committed log
  // index — the forwarding node's read-your-writes barrier waits for its
  // local apply to reach that index before acking its client.
  bytes response = 2;
  uint64 log_index = 3;
  // Set when not applied: where the leader is believed to be.
  optional uint64 leader_id = 4;
  optional string leader_addr = 5;
}

// A storage-level read against a shard's applied state, executed at the
// group's leader after a read-index barrier (linearizable; spec.md §4.2
// — a bounded-staleness field may be added for follower reads later,
// OQ-7). Shaped like Propose: opaque versioned op bytes, leader hint
// when not served (docs/design-room-sharding-phase2.md).
message ReadRequest {
  uint64 group = 1;
  // postcard-encoded saltator_shard::ReadOp.
  bytes op = 2;
}

message ReadResponse {
  bool served = 1;
  // Set when served: postcard-encoded saltator_shard::ReadValue.
  bytes result = 2;
  // Set when not served: where the leader is believed to be.
  optional uint64 leader_id = 3;
  optional string leader_addr = 4;
}

// A change-stream subscription with server-side backfill: the stream
// replays `(from_seq, applied]` from seq-indexed state, then splices
// into the live broadcast, gap-free. Served by ANY replica of the group
// (tailing consumers tolerate replication lag); resuming after a
// disconnect is a new Subscribe from the last seen seq.
message SubscribeRequest {
  uint64 group = 1;
  // Exclusive: the first frame has seq > from_seq. 0 = everything.
  uint64 from_seq = 2;
}

message ChangeFrame {
  uint64 seq = 1;
  // The app's change payload, byte-identical to the local broadcast.
  bytes payload = 2;
}

// An app-level intent executed where the group is hosted — the write
// path for unhosted shards. The pipeline that turns an intent into a
// Raft command (reads, auth, state resolution, signing) runs only at
// the shard's leader (spec.md §5.2), so the INTENT travels, not the
// command. Leader-gated with hints, like Propose/Read.
message ExecuteRequest {
  uint64 group = 1;
  // postcard-encoded app intent (the app owns the meaning; rooms use
  // saltator_roomserver::RoomIntent).
  bytes intent = 2;
}

message ExecuteResponse {
  bool served = 1;
  // Set when served: the app's (postcard) response bytes.
  bytes result = 2;
  // Set when not served: where the leader is believed to be.
  optional uint64 leader_id = 3;
  optional string leader_addr = 4;
}

// Whole-shard state for a move (docs/design-room-sharding-phase2.md,
// 2b part 2): a joining replica pre-seeds itself from any current
// replica, then the Raft leader replicates only the log tail. BULK
// traffic: clients MUST call this over a dedicated connection (its own
// channel, hence its own TCP stream) so checkpoint bytes never share a
// connection with Raft heartbeats (spec.md §8's connection classes —
// the separation is the client's connection discipline; the server
// listener is shared).
message CheckpointRequest {
  uint64 group = 1;
}

message CheckpointChunk {
  // One chunk of the postcard-encoded TransferSnapshot.
  bytes data = 1;
}

service BulkService {
  rpc FetchCheckpoint(CheckpointRequest) returns (stream CheckpointChunk);
}

service ControlService {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc Propose(ProposeRequest) returns (ProposeResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc Subscribe(SubscribeRequest) returns (stream ChangeFrame);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
}
