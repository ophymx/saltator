name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly unfiltered run: the federation suite executes without the
    # deferred-bucket skip, so a deferred test that starts passing is
    # still noticed.
    - cron: "0 6 * * 1"

# A superseded push is not worth finishing. Scheduled runs get their own
# group so a push never cancels the weekly unfiltered suite.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (release)
    # One release build shared (as an artifact) by every job that runs the
    # binary. Pinned (not -latest): the binary executes inside the
    # ubuntu:24.04 Complement image, so builder and image glibc must stay
    # matched.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build saltator (release)
        run: cargo build --release -p saltator
      - uses: actions/upload-artifact@v7
        with:
          name: saltator-release
          path: target/release/saltator
          # Consumed within this run only; don't bill storage for 90 days.
          retention-days: 1

  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        # `cargo test --workspace --all-targets` links every test binary with
        # RocksDB statically embedded; on a stock runner that can exhaust the
        # disk mid-link (ld SIGBUS / ENOSPC). Reclaim the large preinstalled
        # SDKs we don't use (~25GB).
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  cluster-smoke:
    name: cluster (2-node)
    # Two real saltator binaries form a cluster: node 2 joins node 1 and the
    # reconciler admits it as a voter of both shard groups. Gates — a broken
    # join/placement/reconcile path fails the build.
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: saltator-release
          path: target/release
      # Artifacts drop the exec bit.
      - run: chmod +x target/release/saltator
      - name: Two-node smoke test
        run: ./scripts/two_node_smoke.sh target/release/saltator

  chaos:
    name: chaos (3-node kill -9)
    # M4 exit criterion (spec.md §12): a 3-node cluster survives kill -9 of
    # the room-shard leader mid-traffic with no message loss. Gates.
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: saltator-release
          path: target/release
      - run: chmod +x target/release/saltator
      - name: Three-node chaos test
        run: ./scripts/three_node_chaos.sh target/release/saltator

  complement:
    name: complement (csapi)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: saltator-release
          path: target/release
      - run: chmod +x target/release/saltator
      - name: Build Complement image
        run: |
          cp target/release/saltator docker/complement/saltator
          docker build -t complement-saltator:latest docker/complement
      - name: Checkout Complement
        uses: actions/checkout@v7
        with:
          repository: matrix-org/complement
          # Pinned so runs are reproducible; bump deliberately.
          ref: f002aff99e240c994231a21985546b1c16d4173c
          path: complement
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: complement/go.sum
      - name: Run Complement CS suite
        working-directory: complement
        env:
          COMPLEMENT_BASE_IMAGE: complement-saltator:latest
        # Pass-rate is tracked, not gated (spec.md "Protocol compliance"):
        # the suite is allowed to have failures while coverage grows, so the
        # step succeeds unless the harness itself breaks. The JSON stream
        # goes only to the file — a test stuck in a retry loop once flooded
        # the step log until the runner killed the job.
        run: go test -json -timeout 30m ./tests/csapi > /tmp/complement.json || true
      - name: Pass-rate summary + regression gate
        env:
          ALLOWLIST: docker/complement/csapi-allowed-failures.txt
        run: |
          pass=$(jq -r 'select(.Action=="pass" and .Test != null) | .Test' /tmp/complement.json | wc -l)
          fail=$(jq -r 'select(.Action=="fail" and .Test != null) | .Test' /tmp/complement.json | wc -l)
          skip=$(jq -r 'select(.Action=="skip" and .Test != null) | .Test' /tmp/complement.json | wc -l)
          total=$((pass + fail))
          # Also to stdout: the step summary is not reachable through the
          # API, and the JSON stream no longer hits the step log.
          echo "Complement csapi: ${pass}/${total} passed (${skip} skipped)"
          jq -r 'select(.Action=="fail" and .Test != null) | "FAILED: " + .Test' /tmp/complement.json
          echo "## Complement csapi: ${pass}/${total} passed (${skip} skipped)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Failed tests</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          jq -r 'select(.Action=="fail" and .Test != null) | "- `" + .Test + "`"' /tmp/complement.json >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

          # Zero passes means the image or deployer is broken, not a
          # protocol gap — fail loudly.
          if [ "$pass" -eq 0 ]; then
            echo "no Complement tests passed; deployment is broken" >&2
            exit 1
          fi

          # Regression gate: fail on any *leaf* failure not in the
          # allowlist. Leaf = a failing test with no failing descendant, so
          # a parent that fails only because of an allowed child is ignored.
          mapfile -t fails < <(jq -r 'select(.Action=="fail" and .Test != null) | .Test' /tmp/complement.json | sort -u)
          mapfile -t allow < <(grep -vE '^[[:space:]]*(#|$)' "$ALLOWLIST" | sed 's/[[:space:]]*$//')
          in_list() { local x="$1" a; for a in "${allow[@]}"; do [ "$a" = "$x" ] && return 0; done; return 1; }
          is_leaf() { local t="$1" s; for s in "${fails[@]}"; do case "$s" in "$t"/*) return 1;; esac; done; return 0; }

          unexpected=()
          for t in "${fails[@]}"; do
            is_leaf "$t" || continue
            in_list "$t" || unexpected+=("$t")
          done
          # Surface stale allowlist entries (listed but no longer failing).
          for a in "${allow[@]}"; do
            printf '%s\n' "${fails[@]}" | grep -qxF "$a" || \
              echo "::warning::allowlisted csapi test no longer failing; remove from ${ALLOWLIST}: ${a}"
          done
          if [ "${#unexpected[@]}" -gt 0 ]; then
            echo "::error::unexpected Complement csapi failures (not in ${ALLOWLIST}):"
            printf '  %s\n' "${unexpected[@]}" >&2
            exit 1
          fi
          echo "No unexpected csapi failures (${#allow[@]} allowlisted)."
      # The raw go-test JSON (with per-test failure output) is only here —
      # it no longer hits the step log.
      - name: Upload results JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: complement-csapi-json
          path: /tmp/complement.json
          retention-days: 7

  complement-federation:
    name: complement (federation)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: saltator-release
          path: target/release
      - run: chmod +x target/release/saltator
      - name: Build Complement image
        run: |
          cp target/release/saltator docker/complement/saltator
          docker build -t complement-saltator:latest docker/complement
      - name: Checkout Complement
        uses: actions/checkout@v7
        with:
          repository: matrix-org/complement
          ref: f002aff99e240c994231a21985546b1c16d4173c
          path: complement
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: complement/go.sum
      - name: Run Complement federation suite
        working-directory: complement
        env:
          COMPLEMENT_BASE_IMAGE: complement-saltator:latest
          # Deferred-feature buckets (knocking, restricted rooms/spaces,
          # federated device-list stream tracking) are red until their
          # milestone and burn full timeouts on every push (~6 min of the
          # suite). Skipped per-push; the weekly scheduled run is
          # unfiltered.
          SKIP_DEFERRED: ${{ github.event_name != 'schedule' && '-skip=Knock|RestrictedRooms|TestDeviceListsUpdateOverFederation' || '' }}
        # The federation suite is the root `tests` package (not
        # `tests/csapi`). Tracked, not gated: federation coverage is early,
        # so this reports the pass rate and never fails the build — it exists
        # to surface which endpoints the real handshake demands next.
        run: go test -json -timeout 30m $SKIP_DEFERRED ./tests | tee /tmp/complement-fed.json || true
      - name: Pass-rate summary
        run: |
          pass=$(jq -r 'select(.Action=="pass" and .Test != null) | .Test' /tmp/complement-fed.json | wc -l)
          fail=$(jq -r 'select(.Action=="fail" and .Test != null) | .Test' /tmp/complement-fed.json | wc -l)
          skip=$(jq -r 'select(.Action=="skip" and .Test != null) | .Test' /tmp/complement-fed.json | wc -l)
          total=$((pass + fail))
          echo "## Complement federation: ${pass}/${total} passed (${skip} skipped)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Passed tests</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          jq -r 'select(.Action=="pass" and .Test != null) | "- `" + .Test + "`"' /tmp/complement-fed.json >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Failed tests</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          jq -r 'select(.Action=="fail" and .Test != null) | "- `" + .Test + "`"' /tmp/complement-fed.json >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"

  synapse-interop:
    name: interop (synapse)
    # The M3 + M5 exit criteria against a real Synapse: a saltator user
    # joins a Synapse-hosted room, messages flow both ways in the clear,
    # then fresh matrix-nio devices exchange Megolm-encrypted messages
    # (device-key query, one-time-key claim, and to-device room-key
    # sharing all crossing federation). Unlike the Complement jobs
    # (tracked pass-rate), this is a binary proof and GATES.
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: saltator-release
          path: target/release
      - run: chmod +x target/release/saltator
      - name: Build saltator interop image
        run: |
          cp target/release/saltator docker/complement/saltator
          docker build -t interop-saltator:latest docker/complement
      - name: Install E2EE test client (matrix-nio)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libolm-dev
          python3 -m venv /tmp/nio-venv
          /tmp/nio-venv/bin/pip install --quiet "matrix-nio[e2e]"
      - name: Synapse interop round-trip
        env:
          E2EE_PYTHON: /tmp/nio-venv/bin/python
        run: ./docker/interop/run.sh
      - name: Result summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Synapse interop: ✅ PASS — federated join, bidirectional messaging, E2EE round trip" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Synapse interop: ❌ FAIL (see the interop step logs)" >> "$GITHUB_STEP_SUMMARY"
          fi
