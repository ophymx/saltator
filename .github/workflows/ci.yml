name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly unfiltered run: the federation suite executes without the
    # deferred-bucket skip, so a deferred test that starts passing is
    # still noticed.
    - cron: "0 6 * * 1"

# A superseded push is not worth finishing. Scheduled runs get their own
# group so a push never cancels the weekly unfiltered suite.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The toolchain is pinned, not floating. `@stable` meant a Rust release
  # could turn the repo red with no commit behind it — and with
  # `clippy -- -D warnings` below, every new lint is that break.
  # pg-agent-rs cut a release on a runner three versions ahead of the
  # machine the change was verified on and found out the hard way.
  #
  # Keep in lockstep with rust-toolchain.toml, which is what cargo
  # actually obeys here — the action only sets rustup's *default*, and a
  # toolchain file outranks the default.
  RUST_PIN: "1.98.0"
  # Hardware CRC32c for RocksDB, which checksums every block it writes and
  # verifies every block it reads — so this is on both hot paths.
  #
  # librocksdb-sys derives its `-m` flags from CARGO_CFG_TARGET_FEATURE
  # ("This is needed to enable hardware CRC32C", its build.rs says), and the
  # stock x86-64 baseline is `fxsr,sse,sse2`. That yields `-msse2` and
  # nothing else, and rocksdb's crc32c.cc gates its fast paths on the
  # compiler-defined `__SSE4_2__` / `__PCLMUL__`, so the shipped object had
  # zero crc32 and zero pclmulqdq instructions — measured, not assumed.
  #
  # `+pclmulqdq` has to be named on its own: it is in neither x86-64-v2 nor
  # x86-64-v3, and rocksdb wants BOTH it and SSE4.2 before it selects the
  # three-way pipelined implementation.
  #
  # This sets a CPU FLOOR on everything CI builds, and it is a real one.
  # rocksdb's Choose_Extend() says "runtime detection no longer supported on
  # x86" and returns crc32c_3way unconditionally once those macros are
  # defined — there is no CPUID guard to fall back on, so a binary built
  # here executes SSE4.2 and PCLMULQDQ or dies with SIGILL.
  #
  # PCLMULQDQ is the binding constraint, not SSE4.2, and it is half a
  # generation newer: it shipped with AES-NI in Intel Westmere (2010) and
  # AMD Bulldozer (2011), where SSE4.2 alone reaches back to Nehalem
  # (2008). Treat 2013 as the practical floor rather than 2010 — the
  # low-power lines are what actually bite. Bonnell-era Atoms have no
  # SSE4.2 at all, and neither Intel nor AMD covered low-power silicon
  # until Silvermont and Jaguar in 2013. A homeserver on a cheap VPS or a
  # small box is exactly where that matters.
  #
  # Local builds do not get this and do not need it (see README) — they stay
  # portable and take the software path. Changing this line re-mints every
  # Rust cache once, because RUSTFLAGS is part of the cache key.
  RUSTFLAGS: "-C target-cpu=x86-64-v2 -C target-feature=+pclmulqdq"

jobs:
  # Classifies the push/PR diff so a docs-only change (every file under
  # docs/ or ending in .md) skips the build-and-test machinery. Only the
  # three ROOT jobs carry the gate — frontend, check, licenses — because
  # everything expensive hangs off `build` (which needs frontend), and a
  # skipped dependency skips its dependents. Fails open: schedule runs,
  # branch creations, and anything unclassifiable run the full pipeline.
  changes:
    name: classify diff
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: ./scripts/ci_docs_only.sh

  frontend:
    name: admin console (bundle)
    # The console bundle is built here, once, and shared as an artifact —
    # the same contract as the release binary below. cargo NEVER shells
    # out to npm (crates/saltator-admin-ui/build.rs), so this is the only
    # place Node is required and `cargo build` keeps needing nothing but a
    # Rust toolchain.
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # rust-cache does not cover node_modules, and without an explicit
          # cache every PR pays a cold `npm ci`.
          cache: npm
          cache-dependency-path: web/admin/package-lock.json
      - run: npm ci
        working-directory: web/admin
      - run: npm run check
        working-directory: web/admin
      - run: npm run build
        working-directory: web/admin
      - uses: actions/upload-artifact@v7
        with:
          name: admin-ui-dist
          path: crates/saltator-admin-ui/dist
          retention-days: 1

  build:
    name: build (release)
    needs: [frontend]
    # One release build shared (as an artifact) by every job that runs the
    # binary. Pinned (not -latest): the binary executes inside the
    # ubuntu:24.04 Complement image, so builder and image glibc must stay
    # matched.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_PIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Main-only saves; see the fmt+clippy+test job's cache note.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v8
        with:
          name: admin-ui-dist
          path: crates/saltator-admin-ui/dist
      - name: Build saltator (release)
        # The shipped binary carries the console; the feature is off by
        # default, so this is the one place it is turned on.
        run: cargo build --release -p saltator --features admin-ui
      - uses: actions/upload-artifact@v7
        with:
          name: saltator-release
          path: target/release/saltator
          # Consumed within this run only; don't bill storage for 90 days.
          retention-days: 1
      # Build the Complement/interop image once here and share it as an
      # artifact, instead of rebuilding it in each of the three suites. The
      # `apt-get`/base-image layers are cached across runs via the GHA
      # backend (mode=max also caches the pulled base, dodging Docker Hub
      # rate limits), so steady-state this is seconds; the consumers only
      # `docker load` the ~40 MB tarball.
      - run: cp target/release/saltator docker/complement/saltator
      - uses: docker/setup-buildx-action@v4
      - name: Build Complement image
        uses: docker/build-push-action@v7
        with:
          context: docker/complement
          tags: complement-saltator:latest
          load: true
          cache-from: type=gha,scope=complement-image
          # mode=min: we only ever load the final image; caching every
          # intermediate layer was pure 10 GiB-quota burn (dozens of
          # buildkit blobs) crowding the rust caches.
          cache-to: type=gha,mode=min,scope=complement-image
      - name: Export Complement image
        run: docker save complement-saltator:latest | zstd -T0 -o /tmp/complement-image.zst
      - uses: actions/upload-artifact@v7
        with:
          name: complement-image
          path: /tmp/complement-image.zst
          retention-days: 1

  check:
    name: fmt + clippy + test
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        # `cargo test --workspace --all-targets` links every test binary with
        # RocksDB statically embedded; on a stock runner that can exhaust the
        # disk mid-link (ld SIGBUS / ENOSPC). Reclaim the large preinstalled
        # SDKs we don't use (~25GB).
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_PIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main mints caches: PRs restore but never save, so cache
          # contents always come from a green default-branch run and PR
          # branches stop churning the 10 GiB cache ceiling (evicting
          # main's entries was a source of surprise-cold builds). Saves
          # stay off for failed runs — a job that died mid-link could
          # persist a truncated artifact and poison every later run.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (admin-ui)
        # A default-off feature is unchecked unless we check it. No Node
        # here on purpose — this job already deletes ~25 GB to survive
        # linking, and build.rs guarantees a dist/ (its stub) exists, so
        # the feature compiles without a bundle.
        run: cargo clippy --workspace --all-targets --features admin-ui -- -D warnings
      - name: build tests
        # Compilation is deterministic and, on a cache-key change (any
        # Cargo.toml/lock edit), legitimately long — no timeout. Keeping
        # it in its own step also puts compile failures in the right log.
        run: cargo test --workspace --no-run
      - name: run tests
        # Execution is seconds; the timeout exists to catch hangs (e.g. a
        # multi-node Raft/gRPC deadlock under a constrained runner) — it
        # must never be reachable by slow compiles, which is why the build
        # is a separate, untimeouted step.
        timeout-minutes: 5
        run: cargo test --workspace
      - name: run tests (admin-ui)
        # Only the feature-gated tests: everything else already ran above.
        timeout-minutes: 5
        run: cargo test -p saltator-cs-api --features admin-ui --test cs_api admin_ui

  cluster-smoke:
    name: cluster (2-node)
    # Two real saltator binaries form a cluster: node 2 joins node 1 and the
    # reconciler admits it as a voter of both shard groups. Gates — a broken
    # join/placement/reconcile path fails the build.
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: saltator-release
          path: target/release
      # Artifacts drop the exec bit.
      - run: chmod +x target/release/saltator
      - name: Two-node smoke test
        run: ./scripts/two_node_smoke.sh target/release/saltator
      - name: Transaction dedupe across a node hop and a restart
        # The one property no other job can see: cs-api's suite is
        # single-node by construction, and the churn soak deliberately
        # never retries across nodes.
        timeout-minutes: 10
        run: ./scripts/txn_dedupe_smoke.sh target/release/saltator

  chaos:
    name: chaos (3-node kill -9)
    # M4 exit criterion (spec.md §12): a 3-node cluster survives kill -9 of
    # the room-shard leader mid-traffic with no message loss. Gates.
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: saltator-release
          path: target/release
      - run: chmod +x target/release/saltator
      - name: Three-node chaos test
        # Bounded: the script's curls have no --max-time, so a server
        # that accepts but never answers would otherwise hang the job
        # for the runner's 6-hour default (bit PR #71's first run).
        timeout-minutes: 12
        run: ./scripts/three_node_chaos.sh target/release/saltator

  rolling-upgrade:
    name: rolling upgrade (3-node, schema step)
    # Weekly, not per-PR: it needs a SECOND release build (the old binary),
    # and what it guards — an existing cluster being upgraded — is not a
    # thing a pull request can break in a way a push would not.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          # The old revision is checked out from this history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_PIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The NEW binary is the one every other job already uses.
      - uses: actions/download-artifact@v8
        with:
          name: saltator-release
          path: target/release
      - run: chmod +x target/release/saltator
      - name: Build the oldest supported upgrade source
        # Pinned deliberately: this revision is the claim about how far back
        # an in-place upgrade is supported. Moving it forward drops that
        # claim, so move it when the support window actually changes, not to
        # make a red run go green.
        env:
          OLD_REV: 525d7be
        run: |
          git worktree add /tmp/saltator-old "$OLD_REV"
          cd /tmp/saltator-old
          CARGO_TARGET_DIR=/tmp/saltator-old-target cargo build --release -p saltator
      - name: Roll a 3-node cluster from the old binary to this one
        timeout-minutes: 15
        run: |
          ./scripts/rolling_upgrade_smoke.sh \
            /tmp/saltator-old-target/release/saltator \
            target/release/saltator

  complement:
    name: complement (csapi)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: complement-image
          path: /tmp
      - name: Load Complement image
        run: zstd -dc /tmp/complement-image.zst | docker load
      - name: Checkout Complement
        uses: actions/checkout@v7
        with:
          repository: matrix-org/complement
          # Pinned so runs are reproducible; bump deliberately.
          ref: f002aff99e240c994231a21985546b1c16d4173c
          path: complement
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: complement/go.sum
      - name: Run Complement CS suite
        working-directory: complement
        env:
          COMPLEMENT_BASE_IMAGE: complement-saltator:latest
        # Pass-rate is tracked, not gated (spec.md "Protocol compliance"):
        # the suite is allowed to have failures while coverage grows, so the
        # step succeeds unless the harness itself breaks. The JSON stream
        # goes only to the file — a test stuck in a retry loop once flooded
        # the step log until the runner killed the job.
        run: go test -json -timeout 30m ./tests/csapi > /tmp/complement.json || true
      # Summarize + gate: fails on any leaf failure not in the allowlist.
      # (Logic in scripts/complement-csapi-gate.sh — the args are the
      # results JSON, the allowlist, and the step-summary file.)
      - name: Pass-rate summary + regression gate
        run: >-
          bash scripts/complement-csapi-gate.sh
          /tmp/complement.json
          docker/complement/csapi-allowed-failures.txt
          "$GITHUB_STEP_SUMMARY"
      # The raw go-test JSON (with per-test failure output) is only here —
      # it no longer hits the step log.
      - name: Upload results JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: complement-csapi-json
          path: /tmp/complement.json
          retention-days: 7

  complement-federation:
    name: complement (federation)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: complement-image
          path: /tmp
      - name: Load Complement image
        run: zstd -dc /tmp/complement-image.zst | docker load
      - name: Checkout Complement
        uses: actions/checkout@v7
        with:
          repository: matrix-org/complement
          ref: f002aff99e240c994231a21985546b1c16d4173c
          path: complement
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: complement/go.sum
      - name: Run Complement federation suite
        working-directory: complement
        env:
          COMPLEMENT_BASE_IMAGE: complement-saltator:latest
          # Skipped per-push (the weekly scheduled run is unfiltered): only
          # the v7-only knock tests remain (TestKnocking,
          # TestKnockRoomsInPublicRoomsDirectory, TestCannotSendNonKnockVia-
          # SendKnock — room version 7 is unsupported here). The federated
          # device-list tests came off the list 2026-08-05: the E2EE bucket
          # (durable EDU outbox + on-join announce) turned them green and
          # they are gated in federation-must-pass.txt, so skipping them
          # would itself fail the gate as "missing".
          SKIP_DEFERRED: ${{ github.event_name != 'schedule' && '-skip=^TestKnocking$|^TestKnockRoomsInPublicRoomsDirectory$|^TestCannotSendNonKnockViaSendKnock$' || '' }}
        # The federation suite is the root `tests` package (not
        # `tests/csapi`). `|| true` here so the raw `go test` exit never
        # decides the job — the allowlist gate below does. Flipped
        # 2026-08-06 from a positive must-pass list to an allowed-to-fail
        # list (like csapi): coverage reached ~90/96 top-level, so any
        # failure not on the short annotated list is a regression — and a
        # brand-new upstream test that fails is caught by default.
        run: go test -json -timeout 30m $SKIP_DEFERRED ./tests | tee /tmp/complement-fed.json || true
      # Summarize + gate: fails on any leaf failure not in the allowlist.
      # (Logic in scripts/complement-fed-gate.sh — args are the results
      # JSON, the allowlist, and the step-summary file.)
      - name: Pass-rate summary + regression gate
        run: >-
          bash scripts/complement-fed-gate.sh
          /tmp/complement-fed.json
          docker/complement/federation-allowed-failures.txt
          "$GITHUB_STEP_SUMMARY"

  synapse-interop:
    name: interop (synapse)
    # The M3 + M5 exit criteria against a real Synapse: a saltator user
    # joins a Synapse-hosted room, messages flow both ways in the clear,
    # then fresh matrix-nio devices exchange Megolm-encrypted messages
    # (device-key query, one-time-key claim, and to-device room-key
    # sharing all crossing federation). Unlike the Complement jobs
    # (tracked pass-rate), this is a binary proof and GATES.
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: complement-image
          path: /tmp
      - name: Load saltator image
        run: |
          zstd -dc /tmp/complement-image.zst | docker load
          docker tag complement-saltator:latest interop-saltator:latest
      - name: Install E2EE test client (matrix-nio)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libolm-dev
          python3 -m venv /tmp/nio-venv
          /tmp/nio-venv/bin/pip install --quiet "matrix-nio[e2e]"
      - name: Synapse interop round-trip
        env:
          E2EE_PYTHON: /tmp/nio-venv/bin/python
        run: ./docker/interop/run.sh
      - name: Result summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Synapse interop: ✅ PASS — federated join, bidirectional messaging, E2EE round trip" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Synapse interop: ❌ FAIL (see the interop step logs)" >> "$GITHUB_STEP_SUMMARY"
          fi

  licenses:
    # The graph is permissive but not uniformly MIT/Apache — `as_variant`
    # is MPL-2.0 with no alternative, and rocksdb vendors C++ under a
    # GPLv2-or-Apache dual. NOTICE records where and why. This job exists
    # so a dependency bump cannot widen that set without somebody
    # deciding to; the allow-list in deny.toml is the decision record.
    #
    # Independent of the build chain on purpose: it needs no build, no
    # artifact and no Docker, so it reports in seconds and does not queue
    # behind the release build (only the docs-only classifier precedes it).
    name: licenses (cargo-deny)
    needs: [changes]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
